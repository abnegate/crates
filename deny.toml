[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "quoted_printable", allow = ["0BSD"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
