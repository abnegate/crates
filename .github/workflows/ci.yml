name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          cache-on-failure: true

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-hack
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-hack@0.6.45

      - name: Run Clippy on each feature in isolation
        run: cargo hack clippy --workspace --each-feature --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-on-failure: true

      # abnegate-comfy turns a submitted clip into training frames through
      # ffmpeg. Without it that path's end-to-end test skips itself.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Without bubblewrap abnegate-exec reports its confinement backend
      # unusable, and ABNEGATE_EXEC_REQUIRE_CONFINEMENT below turns every test
      # that asks the real sandbox to refuse something into a failure.
      - name: Install bubblewrap
        run: sudo apt-get install -y --no-install-recommends bubblewrap

      # Ubuntu confines unprivileged user namespaces with AppArmor, which
      # bubblewrap needs. Lift it if the knob is present, then prove the backend
      # works -- a job that cannot sandbox should say so, not skip quietly.
      - name: Assert the confinement backend is usable
        run: |
          bwrap --version
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / --die-with-parent true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-nextest@0.9.146

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --all-features --no-fail-fast
        env:
          RUST_BACKTRACE: 1
          ABNEGATE_EXEC_REQUIRE_CONFINEMENT: "1"

      - name: Run doc tests
        run: cargo test --workspace --all-features --doc
        env:
          RUST_BACKTRACE: 1

      - name: Time the secret scanners in a release build
        run: cargo test -p abnegate-secret --release -- --ignored
        env:
          RUST_BACKTRACE: 1

  seatbelt:
    name: Seatbelt Confinement
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seatbelt
          cache-on-failure: true

      - name: Assert the confinement backend is usable
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-nextest@0.9.146

      - name: Run abnegate-exec tests under seatbelt
        run: cargo nextest run -p abnegate-exec --all-targets --no-fail-fast
        env:
          RUST_BACKTRACE: 1
          ABNEGATE_EXEC_REQUIRE_CONFINEMENT: "1"

  hack:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hack
          cache-on-failure: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-hack@0.6.45

      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --depth 2 --all-targets

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          cache-on-failure: true

      # rust-toolchain.toml pins the dev toolchain, and only `+1.97` overrides it.
      - name: Check the published MSRV
        run: |
          rustup toolchain install 1.97 --profile minimal
          cargo +1.97 check --workspace --all-features

  deny:
    name: Licenses and Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        run: cargo deny check

  semver:
    name: Semver
    runs-on: ubuntu-latest
    # Enabled in the first release cycle: cargo-semver-checks has no published
    # baseline to compare against while these crates are unpublished.
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: semver
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Check for breaking changes
        run: cargo semver-checks check-release --workspace --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          cache-on-failure: true

      # docs.rs builds with nightly and --cfg docsrs, and `feature(doc_cfg)` is
      # a hard error on any other channel. `+nightly` is the only thing that
      # beats rust-toolchain.toml.
      - name: Build documentation with every feature
        run: cargo +nightly doc --workspace --all-features --no-deps

      - name: Build documentation without optional features
        run: cargo +nightly doc --workspace --no-default-features --no-deps
