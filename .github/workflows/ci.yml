name: CI

on:
  push:
    branches: [main]
    tags: ['abnegate-*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      flags: ${{ steps.select.outputs.flags }}
      scope: ${{ steps.select.outputs.scope }}
      package: ${{ steps.select.outputs.package }}
      any: ${{ steps.select.outputs.any }}
      all: ${{ steps.select.outputs.all }}
      exec: ${{ steps.select.outputs.exec }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Reading metadata needs no particular toolchain, so stable spares
      # fetching the one rust-toolchain.toml pins.
      - name: Select the affected crates
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          case "$EVENT:$GITHUB_REF" in
            pull_request:*) set -- --base "$BASE" --head "$HEAD" ;;
            push:refs/tags/*) set -- --tag "$GITHUB_REF_NAME" ;;
            *) set -- --all ;;
          esac
          python3 scripts/affected_crates.py "$@" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Refuse public types that cannot gain a field
        if: success() || failure()
        run: python3 scripts/audit_public_api.py

      - name: Test the public API audit
        if: success() || failure()
        run: python3 -m unittest discover --start-directory scripts --verbose

  clippy:
    name: Clippy
    needs: changes
    # A job skipped because Changes failed would satisfy branch protection, so
    # every job runs and the first step fails it instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - &selection
        name: Report the selected crates
        env:
          RESULT: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$RESULT" != success ]; then
            echo '::error::Changes did not finish, so the crates to check are unknown.'
            exit 1
          fi
          echo "Selected: $PACKAGES"

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          cache-on-failure: true

      - name: Run Clippy
        if: needs.changes.outputs.any == 'true'
        run: cargo clippy ${{ needs.changes.outputs.scope }} --all-targets --all-features -- -D warnings

      - name: Install cargo-hack
        if: needs.changes.outputs.any == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-hack@0.6.45

      - name: Run Clippy on each feature in isolation
        if: needs.changes.outputs.any == 'true'
        run: cargo hack clippy ${{ needs.changes.outputs.scope }} --each-feature --all-targets -- -D warnings

  test:
    name: Test Suite
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-on-failure: true

      # abnegate-comfy turns a submitted clip into training frames through
      # ffmpeg, and abnegate-agent searches files with ripgrep. Without them
      # those paths' end-to-end tests skip themselves.
      - name: Install ffmpeg and ripgrep
        if: needs.changes.outputs.any == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ripgrep

      # Without bubblewrap abnegate-exec reports its confinement backend
      # unusable, and ABNEGATE_EXEC_REQUIRE_CONFINEMENT below turns every test
      # that asks the real sandbox to refuse something into a failure.
      - name: Install bubblewrap
        if: needs.changes.outputs.any == 'true'
        run: sudo apt-get install -y --no-install-recommends bubblewrap

      # Ubuntu confines unprivileged user namespaces with AppArmor, which
      # bubblewrap needs. Lift it if the knob is present, then prove the backend
      # works -- a job that cannot sandbox should say so, not skip quietly.
      - name: Assert the confinement backend is usable
        if: needs.changes.outputs.any == 'true'
        run: |
          bwrap --version
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / --die-with-parent true

      - name: Install cargo-nextest
        if: needs.changes.outputs.any == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-nextest@0.9.146

      - name: Run tests
        if: needs.changes.outputs.any == 'true'
        run: cargo nextest run ${{ needs.changes.outputs.scope }} --all-targets --all-features --no-fail-fast
        env:
          RUST_BACKTRACE: 1
          ABNEGATE_EXEC_REQUIRE_CONFINEMENT: "1"

      - name: Run doc tests
        if: needs.changes.outputs.any == 'true'
        run: cargo test ${{ needs.changes.outputs.scope }} --all-features --doc
        env:
          RUST_BACKTRACE: 1

      - name: Time the secret scanners in a release build
        if: contains(fromJSON(needs.changes.outputs.packages), 'abnegate-secret')
        run: cargo test -p abnegate-secret --release -- --ignored
        env:
          RUST_BACKTRACE: 1

  seatbelt:
    name: Seatbelt Confinement
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.exec == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.exec == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.exec == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seatbelt
          cache-on-failure: true

      - name: Assert the confinement backend is usable
        if: needs.changes.outputs.exec == 'true'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

      - name: Install cargo-nextest
        if: needs.changes.outputs.exec == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-nextest@0.9.146

      - name: Run abnegate-exec tests under seatbelt
        if: needs.changes.outputs.exec == 'true'
        run: cargo nextest run -p abnegate-exec --all-targets --no-fail-fast
        env:
          RUST_BACKTRACE: 1
          ABNEGATE_EXEC_REQUIRE_CONFINEMENT: "1"

  hack:
    name: Feature Matrix
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hack
          cache-on-failure: true

      - name: Install cargo-hack
        if: needs.changes.outputs.any == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-hack@0.6.45

      - name: Check every feature combination
        if: needs.changes.outputs.any == 'true'
        run: cargo hack check ${{ needs.changes.outputs.scope }} --feature-powerset --depth 2 --all-targets

      # With --all-targets a dev-dependency's features reach the library too, so
      # a crate that only builds because a test enabled a feature passes the
      # step above and fails for a consumer.
      - name: Check every feature combination without dev-dependencies
        if: needs.changes.outputs.any == 'true'
        run: cargo hack check ${{ needs.changes.outputs.scope }} --feature-powerset --depth 2 --no-dev-deps

  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          cache-on-failure: true

      # rust-toolchain.toml pins the dev toolchain, and only `+1.97` overrides it.
      - name: Check the published MSRV
        if: needs.changes.outputs.any == 'true'
        run: |
          rustup toolchain install 1.97 --profile minimal
          cargo +1.97 check ${{ needs.changes.outputs.scope }} --all-features

  deny:
    name: Licenses and Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        run: cargo deny check

  package:
    name: Package
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package
          cache-on-failure: true

      # The scope also names each workspace crate an affected one depends on:
      # cargo verifies a package against the registry's copy of any dependency
      # not packaged alongside it, which is missing or older than this commit.
      - name: Package the affected crates
        if: needs.changes.outputs.any == 'true'
        run: cargo package ${{ needs.changes.outputs.package }}

      - name: Package the affected crates with every feature
        if: needs.changes.outputs.any == 'true'
        run: cargo package ${{ needs.changes.outputs.package }} --all-features

      # rust-cache's post step mistakes each unpacked crate's tests/ directory
      # for a build profile and reports every missing tests/target and
      # tests/trybuild beneath it as an error.
      - name: Drop the unpacked packages before the cache is saved
        if: always() && needs.changes.outputs.any == 'true'
        run: rm -rf target/package

  semver:
    name: Semver
    if: >-
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-'))
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-plz-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: semver
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Check for breaking changes
        run: cargo semver-checks check-release --workspace --all-features

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
    steps:
      - *selection

      - name: Checkout repository
        if: needs.changes.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: needs.changes.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly

      - name: Cache cargo dependencies
        if: needs.changes.outputs.any == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          cache-on-failure: true

      # docs.rs builds with nightly and --cfg docsrs, and `feature(doc_cfg)` is
      # a hard error on any other channel. `+nightly` is the only thing that
      # beats rust-toolchain.toml.
      - name: Build documentation with every feature
        if: needs.changes.outputs.any == 'true'
        run: cargo +nightly doc ${{ needs.changes.outputs.scope }} --all-features --no-deps

      - name: Build documentation without optional features
        if: needs.changes.outputs.any == 'true'
        run: cargo +nightly doc ${{ needs.changes.outputs.scope }} --no-default-features --no-deps

  brand:
    name: Brand Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse donor names in published sources
        run: |
          hits=$({
            grep -rniw zone crates/*/src crates/*/tests crates/*/examples crates/*/README.md 2>/dev/null | grep -v timezone
            grep -rnE '\b(Zone|Claudear|Mg)[A-Z]' crates
            grep -rnE '\b(ZONE|CLAUDEAR)_' crates
            grep -rniE '^\s*//[/!].*\b(claudear|minigame)\b' crates/*/src
            grep -rniE '\b(claudear|minigame)\b' crates/*/README.md
          } || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            exit 1
          fi
