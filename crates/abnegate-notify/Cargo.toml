[package]
name = "abnegate-notify"
description = "One notification delivered to every channel at once, with per-channel isolation and SSRF-guarded webhooks"
keywords = ["notifications", "slack", "discord", "webhook", "smtp"]
categories = ["asynchronous", "email", "network-programming"]
readme = "README.md"
version = "0.1.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
smtp = ["dep:lettre"]
testing = ["tokio/sync"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.7" }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
lettre = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["form", "json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
wiremock = { workspace = true }
