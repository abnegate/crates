[package]
name = "abnegate-index"
description = "Source chunking, query rewriting, learned ranking and hybrid fusion for host-owned semantic code search"
keywords = ["chunking", "embeddings", "retrieval", "search", "tree-sitter"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
code-chunking = [
    "dep:regex",
    "dep:tree-sitter",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-kotlin-sg",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-yaml",
]
testing = []

[dependencies]
hex = { workspace = true }
regex = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-kotlin-sg = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-sequel = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "code_chunking"
required-features = ["code-chunking"]

[[test]]
name = "code_golden"
required-features = ["code-chunking"]
