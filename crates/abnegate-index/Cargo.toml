[package]
name = "abnegate-index"
description = "Overlapping-window source chunking and host-owned semantic code search"
keywords = ["index", "embeddings", "chunking", "search", "source"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
testing = []

[dependencies]
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
