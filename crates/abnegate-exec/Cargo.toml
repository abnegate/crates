[package]
name = "abnegate-exec"
description = "Sandboxed command execution with streaming output: seatbelt on macOS, bubblewrap on Linux, process-group cancellation and an NDJSON job protocol"
keywords = ["sandbox", "seatbelt", "bubblewrap", "process", "executor"]
categories = ["asynchronous", "os::unix-apis", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
nix = { workspace = true, features = ["event", "fs", "process", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
