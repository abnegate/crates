[package]
name = "abnegate-comfy"
description = "ComfyUI image, video, and audio generation, model inventory, and LoRA training"
keywords = ["comfyui", "lora", "diffusion", "flux", "image-generation"]
categories = [
    "api-bindings",
    "computer-vision",
    "multimedia::audio",
    "multimedia::images",
    "multimedia::video",
]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
saliency = ["abnegate-vision/saliency"]

[dependencies]
abnegate-exec = { path = "../abnegate-exec", version = "0.1.0" }
abnegate-llm = { path = "../abnegate-llm", version = "0.1.0" }
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
abnegate-vision = { path = "../abnegate-vision", version = "0.1.0" }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock = { workspace = true }
