[package]
name = "abnegate-recurrence"
description = "An RFC 5545 RRULE subset evaluated on an IANA timezone's wall clock, with fixed rules for the times daylight saving skips or repeats"
keywords = ["rrule", "recurrence", "schedule", "timezone", "calendar"]
categories = ["date-and-time"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
