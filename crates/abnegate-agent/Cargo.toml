[package]
name = "abnegate-agent"
description = "A ReAct agent loop with a sandbox-aware tool registry, background jobs, token-aware context compaction, chat history storage, session persistence, prompt templates and an optional MCP client"
keywords = ["agent", "llm", "tools", "mcp", "react"]
categories = ["asynchronous", "development-tools", "text-processing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
mcp = ["dep:rmcp"]

[dependencies]
abnegate-config = { path = "../abnegate-config", version = "0.1.0" }
abnegate-exec = { path = "../abnegate-exec", version = "0.1.0" }
abnegate-llm = { path = "../abnegate-llm", version = "0.1.0" }
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
nix = { workspace = true, features = ["fs", "process", "signal"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, optional = true, features = ["client", "transport-child-process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
unicode-bidi = { workspace = true }
unicode-normalization = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "macros", "schemars", "server", "transport-async-rw", "transport-child-process"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
