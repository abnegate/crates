[package]
name = "abnegate-llm"
description = "OpenAI-compatible chat completions with SSE streaming and weighted provider routing, modality-axis provider traits, cost estimation and local hardware profiling"
keywords = ["llm", "ai", "openai", "router", "streaming"]
categories = ["api-bindings", "asynchronous", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
anthropic = []
google = ["dep:url"]
openai = ["dep:base64"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
