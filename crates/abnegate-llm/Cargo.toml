[package]
name = "abnegate-llm"
description = "Modality-axis provider traits, cost estimation and local hardware profiling for large language and generative models"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
anthropic = ["dep:reqwest", "dep:tokio"]
google = ["dep:reqwest", "dep:url"]
openai = ["dep:base64", "dep:reqwest", "dep:tokio"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
futures = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
