[package]
name = "abnegate-llm"
description = "OpenAI-compatible chat completions with SSE streaming and weighted provider routing, modality-axis provider traits, cost estimation, local hardware profiling and model catalogue browsing"
keywords = ["llm", "ai", "openai", "router", "catalog"]
categories = [
    "api-bindings",
    "asynchronous",
    "web-programming",
    "web-programming::http-client",
]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
anthropic = []
catalog = ["dep:once_cell", "dep:regex", "dep:scraper", "dep:urlencoding"]
download = []
google = []
openai = ["dep:base64"]

[dependencies]
abnegate-http = { path = "../abnegate-http", version = "0.1.0" }
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
futures = { workspace = true }
once_cell = { workspace = true, optional = true }
rand = { workspace = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true }
scraper = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
