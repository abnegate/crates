[package]
name = "abnegate-llm"
description = "OpenAI-compatible chat completions with SSE streaming, pooled keep-alive, reasoning effort, and a provider abstraction with weighted routing and fallback chains"
keywords = ["llm", "openai", "streaming", "completion", "router"]
categories = ["api-bindings", "asynchronous", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
