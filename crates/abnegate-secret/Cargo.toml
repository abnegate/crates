[package]
name = "abnegate-secret"
description = "Secret values that zeroize on drop, redact in Debug and logs, and encrypt at rest with an AES-256-GCM envelope"
keywords = ["secret", "redaction", "zeroize", "encryption", "credentials"]
categories = ["cryptography", "config"]
readme = "README.md"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["encryption"]
encryption = [
    "dep:aes-gcm",
    "dep:base64",
    "dep:dirs",
    "dep:getrandom",
    "dep:hex",
    "dep:thiserror",
    "dep:tracing",
]
rusqlite = ["dep:rusqlite"]
sqlx = ["dep:sqlx"]

[dependencies]
aes-gcm = { workspace = true, optional = true, features = ["zeroize"] }
base64 = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["std"] }
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["any"] }
tempfile = { workspace = true }
toml = { workspace = true }
