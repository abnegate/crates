[package]
name = "abnegate-config"
description = "Typed TOML configuration for command line applications: a generic file loader that transparently decrypts sealed values, an OS keyring token store, and idempotent .env updates"
keywords = ["config", "toml", "keyring", "dotenv", "cli"]
categories = ["config", "command-line-interface"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
keyring = ["dep:chrono", "dep:keyring", "dep:serde_json", "dep:zeroize"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
chrono = { workspace = true, optional = true }
dirs = { workspace = true }
keyring = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true, optional = true }
