[package]
name = "abnegate-agent-cli"
description = "Coding agent CLIs (Claude Code, Codex) driven as child processes behind the abnegate-llm completion provider contract, with bounded NDJSON framing, stream parsers, MCP attachment and execution logs"
keywords = ["llm", "agent", "claude", "codex", "cli"]
categories = ["asynchronous", "command-line-interface", "development-tools"]
readme = "README.md"
version = "0.1.12"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
login = ["dep:abnegate-http", "dep:base64", "dep:nix", "dep:regex", "dep:reqwest", "dep:sha2", "chrono/serde"]

[dependencies]
abnegate-exec = { path = "../abnegate-exec", version = "0.1.11" }
abnegate-http = { path = "../abnegate-http", version = "0.1.5", optional = true }
abnegate-llm = { path = "../abnegate-llm", version = "0.1.10" }
abnegate-secret = { path = "../abnegate-secret", version = "0.1.7" }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
nix = { workspace = true, features = ["fs"], optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["signal", "test-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
