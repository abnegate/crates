[package]
name = "abnegate-agent-cli"
description = "Coding agent CLIs (Claude Code, Codex) driven as child processes behind the abnegate-llm completion provider contract, with bounded NDJSON framing, stream parsers, MCP attachment and execution logs"
keywords = ["llm", "agent", "claude", "codex", "cli"]
categories = ["asynchronous", "command-line-interface", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
abnegate-exec = { path = "../abnegate-exec", version = "0.1.0" }
abnegate-llm = { path = "../abnegate-llm", version = "0.1.0" }
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
