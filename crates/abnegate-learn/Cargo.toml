[package]
name = "abnegate-learn"
description = "In-memory trial memory: record attempts, retrieve similar outcomes, and turn failures into avoid/context suggestions for the next round"
keywords = ["learning", "feedback", "memory", "similarity", "embeddings"]
categories = ["algorithms"]
readme = "README.md"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
