[package]
name = "abnegate-vcs"
description = "Git operations over the git command line: branches, worktrees, merge-conflict reproduction, dependency discovery, GitHub pull requests and GitLab repository reads"
keywords = ["git", "worktree", "merge", "pull-request", "github"]
categories = ["development-tools"]
readme = "README.md"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
github = ["dep:abnegate-http", "dep:chrono", "dep:hex", "dep:hmac", "dep:reqwest", "dep:sha2"]
github-app = ["github", "dep:jsonwebtoken"]
gitlab = ["dep:abnegate-http", "dep:reqwest"]
testing = []

[dependencies]
abnegate-http = { path = "../abnegate-http", version = "0.1.5", optional = true }
abnegate-secret = { path = "../abnegate-secret", version = "0.2.1" }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
wiremock = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["user"] }

[[test]]
name = "conflict"
required-features = ["testing"]
