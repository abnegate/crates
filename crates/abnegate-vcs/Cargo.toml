[package]
name = "abnegate-vcs"
description = "Git operations over the git command line: branches, worktrees, merge-conflict reproduction, dependency discovery and GitHub pull requests"
keywords = ["git", "worktree", "merge", "pull-request", "github"]
categories = ["development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
github = ["dep:chrono", "dep:reqwest"]
testing = []

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[dev-dependencies]
abnegate-vcs = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["net", "test-util"] }
wiremock = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["user"] }
