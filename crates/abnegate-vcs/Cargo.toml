[package]
name = "abnegate-vcs"
description = "Git operations over the git command line: branches, worktrees, merge-conflict reproduction, dependency discovery and GitHub pull requests"
keywords = ["git", "worktree", "merge", "pull-request", "github"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
github = ["dep:chrono", "dep:reqwest"]
test-support = []

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
nix = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
abnegate-vcs = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
