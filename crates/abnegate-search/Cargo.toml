[package]
name = "abnegate-search"
description = "SearXNG metasearch client with a web-search intent heuristic and prompt-ready result formatting"
keywords = ["search", "searxng", "metasearch", "websearch", "client"]
categories = ["web-programming::http-client", "api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
abnegate-secret = { path = "../abnegate-secret", version = "0.1.0" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
wiremock = { workspace = true }
