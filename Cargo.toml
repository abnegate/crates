[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/abnegate/crates"
rust-version = "1.97"

[workspace.lints.rust]
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false }
async-stream = "0.3"
# Pre-release candidates bump breakingly, so this is not a caret: rc.10 would
# resolve alongside rc.9 and mix two Stripe client generations.
async-stripe = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-stripe-billing = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-stripe-checkout = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-stripe-shared = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-stripe-types = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-stripe-webhook = { version = ">=1.0.0-rc.9, <1.0.0-rc.10", default-features = false }
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
dashmap = "6"
dirs = "7"
fast_image_resize = "6"
fastembed = { version = "7", default-features = false }
futures = "0.3"
getrandom = "0.4"
h2 = "0.4"
hex = "0.4"
hmac = "0.13"
httpdate = "1"
image = { version = "0.25", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
keyring = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls"] }
nix = "0.31"
# Pre-release candidates bump breakingly, so this is the one range that is not a
# caret: rc.14 would resolve alongside rc.13 and link two ONNX runtimes.
ort = { version = ">=2.0.0-rc.13, <2.0.0-rc.14", default-features = false, features = ["std", "api-24"] }
rand = "0.10"
regex = "1"
reqwest = "0.13"
rmcp = { version = "3.9", default-features = false }
scraper = "0.27"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
url = "2"
urlencoding = "2"
uuid = "1"
wiremock = "0.6"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
