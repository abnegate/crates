[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abnegate/crates"
rust-version = "1.97"

[workspace.lints.rust]
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
aes-gcm = "0.11"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chrono = "0.4"
dashmap = "6"
dirs = "7"
fast_image_resize = "6"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false }
keyring = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls"] }
nix = "0.31"
# Pre-release candidates bump breakingly, so this is the one range that is not a
# caret: rc.14 would resolve alongside rc.13 and link two ONNX runtimes.
ort = { version = ">=2.0.0-rc.13, <2.0.0-rc.14", default-features = false, features = ["std", "api-24"] }
rand = "0.10"
regex = "1"
reqwest = "0.13"
rmcp = { version = "3.4", default-features = false }
# sqlx-sqlite caps libsqlite3-sys below 0.38 and both crates set links =
# "sqlite3", so rusqlite 0.40 cannot share a lock file with sqlx 0.9.
rusqlite = { version = "0.39", default-features = false }
scraper = "0.27"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
url = "2"
urlencoding = "2"
uuid = "1"
wiremock = "0.6"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
